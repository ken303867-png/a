name: Deploy PWA to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build swallow cloze standalone page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import gzip

          app_dir = Path("swallow-cloze-614")
          encoded = "".join(
              (app_dir / f"app.part{i:02d}").read_text(encoding="ascii").strip()
              for i in range(1, 11)
          )
          html = gzip.decompress(base64.b64decode(encoded))
          required = [
              b"swallow_cloze_614_independent_pwa_v1",
              "1\u753b\u9762\u306b1\u984c\u305a\u3064\u8868\u793a\u3057\u307e\u3059\u3002".encode("utf-8"),
          ]
          if not all(marker in html for marker in required):
              raise SystemExit("Unexpected swallow-cloze payload")
          (app_dir / "index.html").write_bytes(html)
          print(f"Built {app_dir / 'index.html'}: {len(html)} bytes")
          PY
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

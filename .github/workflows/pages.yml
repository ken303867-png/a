name: Deploy PWA to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build swallow cloze standalone page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import gzip

          app_dir = Path("swallow-cloze-614")
          encoded = "".join(
              (app_dir / f"app.part{i:02d}").read_text(encoding="ascii").strip()
              for i in range(1, 11)
          )
          html = gzip.decompress(base64.b64decode(encoded))
          required = [
              b"swallow_cloze_614_independent_pwa_v1",
              b'"actual_cards":614',
          ]
          if not all(marker in html for marker in required):
              raise SystemExit("Unexpected swallow-cloze payload")

          text = html.decode("utf-8")
          patch_tag = '<script src="./results-patch.js?v=1"></script>'
          if patch_tag not in text:
              if "</body>" not in text:
                  raise SystemExit("Missing body close tag")
              text = text.replace("</body>", patch_tag + "\n</body>", 1)
          html = text.encode("utf-8")
          if b"results-patch.js?v=1" not in html:
              raise SystemExit("Results patch was not injected")

          (app_dir / "index.html").write_bytes(html)
          print(f"Built {app_dir / 'index.html'} with results screen patch: {len(html)} bytes")
          PY
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

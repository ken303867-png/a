name: One-time legacy scale transfer patch
on:
  push:
    paths:
      - '.github/workflows/patch-scale-transfer.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Add transfer script to legacy scale app
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('scale/index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="./data-transfer.js?v=1"></script>'
          if tag not in s:
              pos=s.rfind('</body>')
              if pos < 0:
                  raise SystemExit('closing body tag not found')
              s=s[:pos]+tag+s[pos:]
              p.write_text(s,encoding='utf-8')
          PY
          git diff --check
          if git diff --quiet -- scale/index.html; then
            echo 'Already patched.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scale/index.html
          git commit -m "Connect learning data transfer to legacy scale PWA"
          git push origin HEAD:main

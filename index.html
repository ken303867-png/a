<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">

<title>摂食嚥下 学習アプリ</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",Meiryo,sans-serif;color:#172b3a;background:#f3f7f8}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(180deg,#edf4f6,#f7fafb)}
main{width:min(900px,calc(100% - 32px));margin:auto;padding:48px 0 72px}
header{margin-bottom:24px}h1{margin:0 0 8px;color:#123a5a;font-size:clamp(28px,5vw,42px)}p{color:#607383;line-height:1.7}

.card{display:block;text-decoration:none;color:inherit;background:#fff;border:1px solid #d9e3e8;border-radius:22px;padding:26px;box-shadow:0 12px 34px rgba(18,58,90,.08);transition:.15s}
.card:hover{transform:translateY(-2px);box-shadow:0 16px 38px rgba(18,58,90,.12)}
.tag{display:inline-block;padding:5px 9px;border-radius:999px;background:#e6f5f3;color:#087c78;font-weight:800;font-size:12px}
.card h2{margin:13px 0 8px;color:#123a5a;font-size:22px}.card p{margin:0;font-size:14px}.go{display:inline-block;margin-top:18px;font-weight:800;color:#087c78}
@media(max-width:680px){main{padding-top:28px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body><main>
<header><h1>摂食嚥下 学習アプリ</h1><p>利用するアプリを選択してください。2種類のPWAは別URL・別キャッシュとして独立して動作します。</p></header>
<div class="grid">

</div>
</main>
